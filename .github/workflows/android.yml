name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          # Use pre-installed Android SDK from GitHub runner
          echo "ANDROID_HOME is: $ANDROID_HOME"
          ls $ANDROID_HOME/cmdline-tools/ || echo "No cmdline-tools dir"
          # Accept all licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -3 || true
          # Install required API level
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" 2>&1 | tail -5
          # Create local.properties so Gradle can find the SDK
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Created local.properties with sdk.dir=$ANDROID_HOME"

      - name: Create dummy google-services.json
        working-directory: android/app
        run: |
          printf '{\n  "project_info": {"project_number": "000000000000","project_id": "attendance-demo","storage_bucket": "attendance-demo.appspot.com"},\n  "client": [{"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000","android_client_info": {"package_name": "com.attendance.app"}},"oauth_client": [],"api_key": [{"current_key": "PLACEHOLDER"}],"services": {"appinvite_service": {"other_platform_oauth_client": []}}}],\n  "configuration_version": "1"\n}' > google-services.json

      - name: Install Gradle & generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -3 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0" 2>&1 | tail -5
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create dummy google-services.json
        working-directory: android/app
        run: |
          printf '{\n  "project_info": {"project_number": "000000000000","project_id": "attendance-demo","storage_bucket": "attendance-demo.appspot.com"},\n  "client": [{"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000","android_client_info": {"package_name": "com.attendance.app"}},"oauth_client": [],"api_key": [{"current_key": "PLACEHOLDER"}],"services": {"appinvite_service": {"other_platform_oauth_client": []}}}],\n  "configuration_version": "1"\n}' > google-services.json

      - name: Install Gradle & generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Get version tag
        id: ver
        run: echo "tag=v1.0.$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Release ${{ steps.ver.outputs.tag }}"
          body: |
            ## 📋 Журнал посещаемости

            ### 📱 Установка на Android:
            1. Скачайте `app-debug.apk` ниже
            2. Откройте файл, разрешите установку
            3. Иконка появится на рабочем столе ✨
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
