name: Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install WiX Toolset (required for packageExe)
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.11.2 -y --no-progress
          # Add WiX to PATH
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
            echo "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "WiX added to PATH: $wixPath"
          } else {
            $wixAlt = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wixAlt) {
              echo "$($wixAlt.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "WiX found at: $($wixAlt.FullName)"
            }
          }

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: desktop
        run: gradle wrapper --gradle-version 8.7

      - name: Create placeholder icon
        shell: pwsh
        run: |
          $dir = "desktop/app/src/main/resources"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not (Test-Path "$dir/icon.ico")) {
            # Minimal valid 1x1 ICO
            $ico = [System.Convert]::FromBase64String(
              'AAABAAEAAQEAAAEAIAAoAAAAFgAAACgAAAABAAAAAgAAAAEAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAA/wAAAAA='
            )
            [System.IO.File]::WriteAllBytes("$dir/icon.ico", $ico)
            Write-Host 'Created placeholder icon.ico'
          }

      - name: Build Windows EXE
        working-directory: desktop
        run: ./gradlew :app:packageExe --no-daemon --stacktrace

      - name: Find and copy EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "desktop/app/build/compose/binaries/main/exe/" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "AttendanceJournal-Setup.exe"
            Write-Host "EXE: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"
          } else {
            Write-Host "EXE not found, listing build output:"
            Get-ChildItem -Path "desktop/app/build/" -Recurse | Select-Object FullName
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceJournal-Windows-Setup
          path: AttendanceJournal-Setup.exe
          retention-days: 30

      - name: Get version tag
        if: github.event_name != 'pull_request'
        id: ver
        shell: pwsh
        run: echo "tag=windows-v1.0.$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Windows EXE ${{ steps.ver.outputs.tag }}"
          body: |
            ## 🖥️ Журнал посещаемости — Windows Установщик

            1. Скачайте `AttendanceJournal-Setup.exe`
            2. Запустите — установщик создаст ярлык на рабочем столе ✨
          files: AttendanceJournal-Setup.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
