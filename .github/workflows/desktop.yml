name: Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Desktop App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x desktop/gradlew
        working-directory: .

      - name: Build Desktop JAR
        run: ./gradlew :app:packageUberJarForCurrentOS --no-daemon
        working-directory: desktop

      - name: Upload Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: attendance-journal-desktop
          path: desktop/app/build/compose/jars/*.jar
          retention-days: 30
