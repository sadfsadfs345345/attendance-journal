name: Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: desktop
        run: gradle wrapper --gradle-version 8.7

      - name: Build UberJAR
        working-directory: desktop
        run: ./gradlew :app:packageUberJarForCurrentOS --no-daemon

      - name: Prepare JAR for packaging
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path "desktop/app/build/compose/jars/" -Filter "*.jar" | Select-Object -First 1
          if (-not $jar) { Write-Error "JAR not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path "pkg_input" | Out-Null
          Copy-Item $jar.FullName "pkg_input/attendance-journal.jar"
          Write-Host "JAR: $($jar.Name) ($([math]::Round($jar.Length/1MB,1)) MB)"

      - name: Create app image with jpackage
        shell: pwsh
        run: |
          $jpackage = "$env:JAVA_HOME\bin\jpackage.exe"
          & $jpackage `
            --type app-image `
            --input pkg_input `
            --name "AttendanceJournal" `
            --main-jar attendance-journal.jar `
            --dest app_image `
            --app-version "1.0.0" `
            --description "Журнал посещаемости" `
            --vendor "AttendanceJournal"
          if ($LASTEXITCODE -ne 0) { Write-Error "jpackage failed"; exit 1 }
          Write-Host "App image created:"
          Get-ChildItem app_image -Recurse | Select-Object FullName | Format-Table

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $iss = @'
          [Setup]
          AppName=Журнал посещаемости
          AppVersion=1.0.0
          AppPublisher=AttendanceJournal
          DefaultDirName={localappdata}\AttendanceJournal
          DefaultGroupName=Журнал посещаемости
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=AttendanceJournal-Setup
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          WizardStyle=modern
          SetupIconFile=

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Files]
          Source: "app_image\AttendanceJournal\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autodesktop}\Журнал посещаемости"; Filename: "{app}\AttendanceJournal.exe"
          Name: "{group}\Журнал посещаемости"; Filename: "{app}\AttendanceJournal.exe"
          Name: "{group}\Удалить"; Filename: "{uninstallexe}"

          [Run]
          Filename: "{app}\AttendanceJournal.exe"; Description: "Запустить приложение"; Flags: nowait postinstall skipifsilent
          '@
          $iss | Out-File -FilePath "setup.iss" -Encoding utf8
          Write-Host "Inno Setup script created"

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Get-ChildItem "C:\Program Files (x86)" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Error "Inno Setup not found"; exit 1 }
          Write-Host "Using Inno Setup: $iscc"
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed"; exit 1 }
          $exe = Get-Item "AttendanceJournal-Setup.exe"
          Write-Host "Installer created: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceJournal-Windows-Setup
          path: AttendanceJournal-Setup.exe
          retention-days: 30

      - name: Get version tag
        if: github.event_name != 'pull_request'
        id: ver
        shell: pwsh
        run: echo "tag=windows-v1.0.$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Windows Installer ${{ steps.ver.outputs.tag }}"
          body: |
            ## 🖥️ Журнал посещаемости — Windows

            1. Скачайте `AttendanceJournal-Setup.exe`
            2. Запустите — установщик создаст ярлык на рабочем столе ✨
            3. Java уже встроена — ничего дополнительно устанавливать не нужно
          files: AttendanceJournal-Setup.exe
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
