name: Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: desktop
        run: gradle wrapper --gradle-version 8.7

      - name: Build Desktop UberJar
        working-directory: desktop
        run: ./gradlew :app:packageUberJarForCurrentOS --no-daemon --stacktrace

      - name: Upload Desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: attendance-journal-desktop
          path: desktop/app/build/compose/jars/*.jar
          retention-days: 30
