<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал посещаемости · Premium prototype</title>
<style>
:root{--pr:#4F46E5;--pr-l:#EEF2FF;--pr-d:#3730A3;--gr:#10B981;--rd:#EF4444;--or:#F59E0B;--pu:#8B5CF6;--bg:#F4F6FB;--sf:#FFFFFF;--s2:#F0F2F8;--br:#E2E6F0;--tx:#1A1D2E;--tx2:#6B7490;--tx3:#9EA3B8;--sh:0 1px 3px rgba(30,40,80,.07),0 4px 12px rgba(30,40,80,.04);--r:12px;}
body[data-dark]{--pr:#818CF8;--pr-l:#1C1F3D;--pr-d:#A5B4FC;--bg:#0D0F1C;--sf:#141729;--s2:#1A1E35;--br:#252A48;--tx:#E2E5F4;--tx2:#8B91BE;--tx3:#515778;--sh:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);}
/* Five premium palettes, each with a tuned light and dark surface system. */
body[data-palette="ocean"]{--pr:#0E7490;--pr-l:#ECFEFF;--pr-d:#155E75;--bg:#F2F8FA;--s2:#E7F3F6;--br:#D9E9EE;}
body[data-palette="emerald"]{--pr:#059669;--pr-l:#ECFDF5;--pr-d:#047857;--bg:#F3FAF7;--s2:#E7F5EF;--br:#D8EDE3;}
body[data-palette="rose"]{--pr:#E11D48;--pr-l:#FFF1F2;--pr-d:#BE123C;--bg:#FFF7F8;--s2:#FCECEF;--br:#F3DCE2;}
body[data-palette="amber"]{--pr:#D97706;--pr-l:#FFF7ED;--pr-d:#B45309;--bg:#FFFBF5;--s2:#FFF3E2;--br:#F2E2C7;}
body[data-dark][data-palette="indigo"]{--pr:#818CF8;--pr-l:#1C1F3D;--pr-d:#A5B4FC;--bg:#0D0F1C;--sf:#141729;--s2:#1A1E35;--br:#252A48;--tx:#E2E5F4;--tx2:#8B91BE;--tx3:#515778;}
body[data-dark][data-palette="ocean"]{--pr:#22D3EE;--pr-l:#12323B;--pr-d:#67E8F9;--bg:#08161B;--sf:#102229;--s2:#15323B;--br:#21434D;--tx:#D9F7FB;--tx2:#86B7C1;--tx3:#52747D;}
body[data-dark][data-palette="emerald"]{--pr:#34D399;--pr-l:#10372B;--pr-d:#6EE7B7;--bg:#081812;--sf:#10251C;--s2:#153329;--br:#24503E;--tx:#DDF7EA;--tx2:#8FC8AA;--tx3:#56816C;}
body[data-dark][data-palette="rose"]{--pr:#FB7185;--pr-l:#3A1822;--pr-d:#FDA4AF;--bg:#1B0D12;--sf:#28131A;--s2:#381923;--br:#552635;--tx:#FFE4E8;--tx2:#D79AA5;--tx3:#8E5A66;}
body[data-dark][data-palette="amber"]{--pr:#FBBF24;--pr-l:#392A0C;--pr-d:#FCD34D;--bg:#181208;--sf:#251B0C;--s2:#35260E;--br:#554016;--tx:#FFF1C7;--tx2:#D8B979;--tx3:#907642;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
#app{padding-top:52px;min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--sf);border-bottom:1px solid var(--br);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:100;}
.tbar-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tbar-logo{width:32px;height:32px;background:var(--pr);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.tbar-logo svg{width:18px;height:18px}
.tbar-title{font-weight:800;font-size:14px;color:var(--tx);letter-spacing:-.01em;white-space:nowrap}
.tbar-acts{display:flex;align-items:center;gap:6px}
.sw{background:var(--s2);border:1px solid var(--br);border-radius:7px;color:var(--tx2);cursor:pointer;font-size:11px;font-weight:700;padding:5px 10px;display:flex;align-items:center;gap:5px;transition:all .15s}
.sw svg{width:14px;height:14px}
.sw.on{background:var(--pr-l);color:var(--pr);border-color:var(--pr)}
.a-outer{display:flex;justify-content:center;padding:20px 16px;min-height:calc(100vh - 52px)}
.a-phone{width:360px;border-radius:32px;background:var(--bg);box-shadow:0 12px 48px rgba(0,0,0,.16),0 0 0 1.5px var(--br);overflow:hidden;display:flex;flex-direction:column;height:706px}
.ph{background:var(--pr);padding:16px 20px 14px;flex-shrink:0}.ph-top{display:flex;align-items:center;justify-content:space-between}
.ph-t{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}.ph-s{font-size:11px;color:rgba(255,255,255,.65);margin-top:3px}
.ph-x{background:rgba(255,255,255,.15);border:none;border-radius:9px;color:#fff;cursor:pointer;padding:7px;display:flex;align-items:center;justify-content:center;width:34px;height:34px}
.ph-x svg{width:18px;height:18px}.pbody{flex:1;overflow-y:auto;padding:12px;background:var(--bg)}
.pnav{display:flex;background:var(--sf);border-top:1px solid var(--br);flex-shrink:0}
.pntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;border:none;background:none;color:var(--tx3);font-size:9px;font-weight:700;cursor:pointer;letter-spacing:.02em;line-height:1;border-top:2px solid transparent;transition:color .15s,border-color .15s;position:relative}
.pntab svg{width:22px;height:22px}.pntab.on{color:var(--pr);border-top-color:var(--pr)}
.nbadge{position:absolute;top:4px;right:calc(50% - 14px);background:var(--rd);color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.d-out{display:flex;height:calc(100vh - 52px);overflow:hidden}
.drail{width:220px;background:var(--sf);border-right:1px solid var(--br);display:flex;flex-direction:column;flex-shrink:0}
.drail-logo{padding:18px 18px 14px;border-bottom:1px solid var(--br)}
.drail-logo-top{display:flex;align-items:center;gap:10px}.drail-logo-icon{width:36px;height:36px;background:var(--pr);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.drail-logo-icon svg{width:20px;height:20px}
.drail-logo-name{font-size:13px;font-weight:800;color:var(--tx);line-height:1.2}.drail-logo-role{font-size:11px;color:var(--tx2);margin-top:1px}
.drail-nav{flex:1;padding:8px 0;overflow-y:auto}.drail-foot{padding:8px 0;border-top:1px solid var(--br)}
.ri{display:flex;align-items:center;gap:10px;padding:10px 16px;border:none;background:none;color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;width:100%;text-align:left;border-left:3px solid transparent;transition:all .15s}
.ri svg{width:18px;height:18px;flex-shrink:0}.ri.on{background:var(--pr-l);color:var(--pr);border-left-color:var(--pr);font-weight:700}.ri:hover:not(.on){background:var(--s2);color:var(--tx)}
.ri-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.dmain{flex:1;overflow-y:auto;padding:24px 28px}.dmain-inner{max-width:860px}
.phd{font-size:20px;font-weight:800;color:var(--tx);margin-bottom:20px;letter-spacing:-.02em}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px;border:1px solid var(--br)}
.login-shell{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--sf);border-radius:20px;box-shadow:0 8px 40px rgba(30,40,80,.11);border:1px solid var(--br);width:100%;max-width:420px;padding:36px 32px}
.llogo{text-align:center;margin-bottom:28px}
.llogo-icon{width:56px;height:56px;background:var(--pr);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff}
.llogo-icon svg{width:28px;height:28px}
.llogo h1{font-size:20px;font-weight:900;color:var(--tx);letter-spacing:-.03em}.llogo p{font-size:13px;color:var(--tx2);margin-top:5px}
.lform{display:flex;flex-direction:column;gap:14px}.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase}
.demo-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:6px;font-size:10px;font-weight:800;color:#92400E;letter-spacing:.06em;margin-bottom:6px}
body[data-dark] .demo-badge{color:#FBB940;border-color:rgba(245,158,11,.2)}
.demo-badge svg{width:14px;height:14px;flex-shrink:0}
.inp{border:1.5px solid var(--br);border-radius:10px;font-size:14px;padding:11px 14px;background:var(--sf);color:var(--tx);width:100%;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr-l)}.inp.err{border-color:var(--rd)}
.iw{position:relative}.iw .inp{padding-left:42px;padding-right:44px}
.iw-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);display:flex;align-items:center;pointer-events:none}
.iw-icon svg{width:16px;height:16px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--tx2);display:flex;align-items:center;padding:4px}
.eye svg{width:17px;height:17px}
.errmsg{font-size:11px;color:var(--rd);font-weight:700;min-height:16px}
.auth-link{text-align:center;font-size:13px;color:var(--tx2);margin-top:4px}
.lnk{color:var(--pr);font-weight:700;cursor:pointer}.lnk:hover{text-decoration:underline}
.rpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.rpill{padding:6px 14px;border-radius:20px;border:1.5px solid var(--br);background:var(--sf);color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}.rpill.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:-.01em}
.btn-pr{background:var(--pr);color:#fff}.btn-pr:hover{background:var(--pr-d)}
.btn-danger{background:rgba(239,68,68,.08);color:var(--rd);border:1px solid rgba(239,68,68,.2)}
.btn-ol{display:block;width:100%;padding:11px;border:1.5px solid var(--br);border-radius:10px;background:none;font-size:13px;font-weight:700;cursor:pointer;color:var(--tx2);transition:all .15s;text-align:center}
.btn-ok{background:var(--gr);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:13px;padding:6px 12px;font-weight:700}
.gstrip{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-radius:10px;padding:11px 14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--br);flex-wrap:wrap;gap:6px}
.gd{font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:5px}
.gb{background:var(--pr-l);color:var(--pr);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
.slist{display:flex;flex-direction:column;gap:8px}
.jrow{display:flex;align-items:center;gap:10px;padding:11px 12px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}
.jinfo{flex:1;min-width:0}
.jname{font-size:13px;font-weight:700;line-height:1.3}
.jsub{font-size:11px;color:var(--tx2);margin-top:1px}
.chips{display:flex;gap:5px;flex-shrink:0}
.chip{padding:5px 10px;border-radius:7px;border:none;font-size:11px;font-weight:700;cursor:pointer;transition:opacity .15s}
.chip.on{opacity:1}.chip:not(.on){opacity:.28}.chip:not(.on):hover{opacity:.55}
.cp{background:rgba(16,185,129,.12);color:#059669}
.cu{background:rgba(245,158,11,.12);color:#D97706}
.cn{background:rgba(239,68,68,.12);color:#DC2626}
.hm-badge{display:inline-flex;align-items:center;margin-left:5px;font-size:10px;font-weight:800;background:var(--pr-l);color:var(--pr);border-radius:5px;padding:2px 7px;vertical-align:middle;letter-spacing:.02em}
.hm-btn{background:none;border:1.5px solid var(--br);border-radius:7px;cursor:pointer;font-size:14px;padding:4px 7px;line-height:1;color:var(--tx2);transition:all .15s;flex-shrink:0}
.hm-btn.active{background:rgba(245,158,11,.1);border-color:#F59E0B;color:#D97706}
.jact{display:flex;align-items:center;gap:10px;margin-top:14px}
.conf-banner{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.22);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--rd);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.conf-row{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:8px 12px;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.conf-lbl{font-size:11px;font-weight:800;color:var(--tx2)}
.conf-chip{display:inline-flex;align-items:center;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700}
.accept-btn{background:var(--sf);border:1px solid var(--br);border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;padding:3px 9px;color:var(--tx2);white-space:nowrap;transition:all .15s}
.accept-btn:hover{border-color:var(--pr);color:var(--pr)}
.session-closed-banner{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;color:#059669;margin-bottom:10px;text-align:center;display:flex;align-items:center;gap:8px;justify-content:center}
.unfill-banner{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700;color:#92400E;margin-bottom:10px;display:flex;align-items:center;gap:8px}
body[data-dark] .unfill-banner{color:#FBB940}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-tile{background:var(--sf);border-radius:10px;padding:12px 10px;text-align:center;box-shadow:var(--sh);border:1px solid var(--br)}
.stat-v{font-size:22px;font-weight:900;line-height:1.1}
.stat-l{font-size:9px;font-weight:800;color:var(--tx2);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}
.pie-card{text-align:center;padding:20px 16px}
.gname{font-size:11px;font-weight:800;color:var(--pr);margin-bottom:14px;letter-spacing:.06em;text-transform:uppercase}
.leg{display:flex;gap:16px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.legi{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.scard{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:12px;padding:12px 14px;box-shadow:var(--sh);cursor:pointer;transition:box-shadow .2s;border:1px solid var(--br);margin-bottom:8px}
.scard:hover{box-shadow:0 4px 20px rgba(79,70,229,.14)}
.scard.danger{border-color:rgba(239,68,68,.35)}
.scard.warn{border-color:rgba(245,158,11,.35)}
@keyframes glow{from{box-shadow:0 0 0 1.5px rgba(239,68,68,.25);}to{box-shadow:0 0 0 1.5px rgba(239,68,68,.25),0 0 16px rgba(239,68,68,.12);}}
.scard.danger{animation:glow 2s ease-in-out infinite alternate}
.scinfo{flex:1;min-width:0}.sn{font-size:13px;font-weight:700;line-height:1.3}
.ss{font-size:11px;color:var(--tx2);margin-top:2px}
.slbl{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--br)}
.arch-row{padding:12px 14px;background:var(--sf);border-radius:12px;margin-bottom:8px;border:1px solid var(--br)}
.arch-hd{font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.arch-chip{display:inline-block;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;margin:2px 2px}
.req-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border-radius:12px;margin-bottom:8px;border:1px solid var(--br)}
.req-msg{padding:10px 14px;border-radius:9px;font-size:13px;font-weight:700;margin-bottom:12px;border:1px solid}
.req-msg.ok{background:rgba(16,185,129,.07);color:#059669;border-color:rgba(16,185,129,.22)}
.req-msg.no{background:rgba(239,68,68,.06);color:var(--rd);border-color:rgba(239,68,68,.2)}
.bc{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:16px;flex-wrap:wrap;background:var(--sf);border-radius:10px;padding:10px 14px;border:1px solid var(--br)}
.bci{color:var(--pr);font-weight:700;cursor:pointer}.bci:hover{text-decoration:underline}
.bcs{color:var(--tx3)}.bcc{font-weight:700;color:var(--tx)}
.dcg{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.dirc{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:12px;padding:12px 16px;box-shadow:var(--sh);cursor:pointer;transition:all .15s;border:1px solid var(--br)}
.dirc:hover{border-color:var(--pr);box-shadow:0 4px 16px rgba(79,70,229,.12)}
.dic{width:40px;height:40px;border-radius:10px;background:var(--pr-l);display:flex;align-items:center;justify-content:center;color:var(--pr);flex-shrink:0}
.dic svg{width:20px;height:20px}
.dn{font-size:14px;font-weight:700;color:var(--tx)}.ds{font-size:11px;color:var(--tx2);margin-top:2px}
.tr{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:10px;padding:10px 12px;box-shadow:var(--sh);border:1px solid var(--br);margin-bottom:6px}
.xb{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.18);border-radius:7px;color:var(--rd);cursor:pointer;font-size:12px;font-weight:700;padding:5px 10px;transition:all .15s;display:flex;align-items:center;gap:4px}
.xb:hover{background:rgba(239,68,68,.14)}
.xb svg{width:12px;height:12px}
.set-sec{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--br)}
.chklbl{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:600;margin-top:6px}
.seg{display:flex;gap:8px;margin-top:10px}
.sgo{flex:1;padding:10px;border:1.5px solid var(--br);border-radius:9px;background:var(--sf);color:var(--tx2);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.sgo svg{width:16px;height:16px}
.sgo.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.sgo:disabled{opacity:.35;cursor:default}
.acc-name{font-size:15px;font-weight:800;color:var(--tx);margin-bottom:3px}
.acc-role{font-size:12px;color:var(--tx2);margin-bottom:14px}
.teacher-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--br)}
.teacher-row:last-child{border-bottom:none}
.dtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.dtbl th{background:var(--s2);padding:8px 12px;text-align:left;font-size:10px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.dtbl td{padding:8px 12px;border-bottom:1px solid var(--br)}
.tn{color:var(--rd);font-weight:700}.te{color:#059669;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:all}
.modal{background:var(--sf);border-radius:18px;padding:22px;width:90%;max-width:500px;max-height:82vh;overflow-y:auto;border:1px solid var(--br);box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mt{font-size:17px;font-weight:900;color:var(--tx)}
.xbtn{background:var(--s2);border:none;border-radius:8px;cursor:pointer;padding:7px;color:var(--tx2);display:flex;align-items:center;justify-content:center}

  S.attHM={};S.attTR={};S.attFin={};S.att={};S.attHMSet={};S.confResolved={};
  ST.forEach(function(_,i){S.att[i]='P';S.attHM[i]='P';S.attFin[i]='P';S.attTR[i]='P';});
  if(!S.sessionClosed&&S.role==='TEACHER'){var first=ST.filter(function(x){return x.name==='Козлова Мария';})[0];if(first)S.attTR[ST.indexOf(first)]='N';}
}
function purgeExpiredData(){
  var now=new Date().toISOString().slice(0,10),cut=new Date();cut.setMonth(cut.getMonth()-Math.max(1,Number(S.archiveMo)||6));var cutStr=cut.toISOString().slice(0,10);
  S.archive=S.archive.filter(function(x){return !x.date||x.date>=cutStr;});
  S.storeExpelled=S.storeExpelled.filter(function(ex){
    if(!ex.until||ex.until>now)return true;
    if(ex.data){ex.data._expelled=true;ex.data._purged=true;Object.keys(GRP).forEach(function(g){GRP[g].students=(GRP[g].students||[]).filter(function(st){return st!==ex.data;});});}
    return false;
  });
}
function sortST(arr){
  return arr.slice().sort(function(a,b){
    var pa=a.unex>=30?0:a.unex>=25?1:2,pb=b.unex>=30?0:b.unex>=25?1:2;
    return pa-pb||a.name.localeCompare(b.name,'ru');
  });
}

function ico(name,sz){
  sz=sz||'100%';
  var s=ICONS[name]||ICONS['x'];
  return s.replace('<svg ','<svg width="'+sz+'" height="'+sz+'" style="display:inline-block;vertical-align:middle" ');
}

// RING: fix — arc starts at 12 o'clock via stroke-dashoffset, text stays upright
function ring(pct,color,sz,sw){
  sz=sz||80;sw=sw||8;
  var r=(sz-sw*2)/2,cx=sz/2,cy=sz/2,c=2*Math.PI*r,d=c*pct;
  var offset=(c*0.25).toFixed(1);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" style="display:block;margin:0 auto">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--br)" stroke-width="'+sw+'"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'"'
    +' stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+c.toFixed(1)+'"'
    +' stroke-dashoffset="'+offset+'"/>'
    +'<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="middle"'
    +' font-weight="700" font-size="'+(sz>70?15:12)+'" fill="'+color+'">'+Math.round(pct*100)+'%</text>'
    +'</svg>';
}

function openDetail(name){

    +'<div class="mstat" style="background:rgba(245,158,11,.06)"><div class="msv" style="color:#D97706">'+s.exc+'</div><div class="msl">Уваж.</div></div>'

function expelStudent(name,grp,months){
  if(S.role!=='DIRECTOR')return;
  months=months||S.retainMo||3;
  var now=new Date(),_u=new Date(now);
  _u.setMonth(_u.getMonth()+months);
  var eD=now.toISOString().slice(0,10),uD=_u.toISOString().slice(0,10);
  var expelled=null;
  for(var i=0;i<ST.length;i++){if(ST[i].name===name){expelled=ST[i];ST[i]._expelled=true;break;}}
  if(expelled) S.storeExpelled.push({name:expelled.name,grp:grp,date:eD,until:uD,months:months,data:expelled});
}

function restoreStudent(ei){
  if(S.role!=='DIRECTOR')return;
  var ex=S.storeExpelled[ei];if(!ex)return;
  S.storeExpelled.splice(ei,1);
  ex.data._expelled=false;
  if(!GRP[ex.grp])GRP[ex.grp]={teachers:[],students:[]};
  if(GRP[ex.grp].students.indexOf(ex.data)<0)GRP[ex.grp].students.push(ex.data);
  render();
}

function closeModal(){document.getElementById('ov').classList.remove('open');}
function toast(message){var old=document.querySelector('.toast');if(old)old.remove();var el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.remove();},2600);}

function handleClick(e){
  var t=e.target.closest('[data-a]');
  if(!t)return;
  var a=t.dataset.a,v=t.dataset.v||'';
  if(a==='mode'){S.mode=v;render();}
  else if(a==='dark'){S.dark=!S.dark;S.tm=S.dark?'dark':'light';applyTheme();render();}
  else if(a==='paletteToggle'){var panel=document.getElementById('theme-panel'),paletteButton=document.getElementById('sw-palette');if(panel){var open=!panel.classList.contains('open');panel.classList.toggle('open',open);if(paletteButton)paletteButton.setAttribute('aria-expanded',String(open));}}
  else if(a==='palette'){S.palette=v||'indigo';var panel2=document.getElementById('theme-panel');if(panel2)panel2.classList.remove('open');var pb2=document.getElementById('sw-palette');if(pb2)pb2.setAttribute('aria-expanded','false');applyTheme();render();}
  else if(a==='role'){S.lr=v;S.pe=false;render();}
  else if(a==='eye'){
    if(v==='2'){S.sp2=!S.sp2;var i2=document.getElementById('lpwd2');if(i2)i2.type=S.sp2?'text':'password';t.innerHTML=S.sp2?ico('eyeoff','17'):ico('eye','17');}
    else{S.sp=!S.sp;var i1=document.getElementById('lpwd');if(i1)i1.type=S.sp?'text':'password';t.innerHTML=S.sp?ico('eyeoff','17'):ico('eye','17');}
  }
  else if(a==='login'){doLogin();}
  else if(a==='register'){doRegister();}
  else if(a==='step'){S.step=v;S.pe=false;S.sp=false;S.sp2=false;render();}
  else if(a==='verify'){
    var _ent='';
    for(var _i=0;_i<6;_i++){var _ci=document.getElementById('ci'+_i);if(_ci)_ent+=_ci.value.trim();}
    if(!S.loginCode||_ent!==S.loginCode){
      var _cb=document.querySelector('.cinps');
      if(_cb){_cb.style.animation='none';_cb.offsetHeight;_cb.style.animation='shake .3s';}
      return;
    }
    if(S.flow==='login'){doApprove();}
    else{
      if(S.pendingReg){
        var reqDate=new Date().toISOString().slice(0,10);
        PENDING_REQS.push({role:S.pendingReg.role,rl:S.pendingReg.rl,name:S.pendingReg.name,email:S.pendingReg.email,grp:S.pendingReg.grp,date:reqDate});
      }
      S.step='awaiting';render();
    }
  }
  else if(a==='approve'){doApprove();}
  else if(a==='tab'){S.tab=parseInt(v,10);render();}
  else if(a==='dtab'){S.dt=v;render();}
  else if(a==='att'){
    if(S.sessionClosed||['HEADMAN','TEACHER','CURATOR'].indexOf(S.role)<0)return;
    var ai=parseInt(t.dataset.idx,10);
    if(S.role==='TEACHER')S.attTR[ai]=v;
    else if(S.role==='CURATOR')S.attFin[ai]=v;
    else{S.attHM[ai]=v;S.attHMSet[ai]=true;}
    delete S.confResolved[ai];
    S.att[ai]=v;render();
  }
  else if(a==='detail'){
    if(S.role==='STUDENT'&&t.dataset.sname!==S.user)return;
    openDetail(t.dataset.sname);
  }
  else if(a==='acceptHM'){if(S.role!=='CURATOR'||S.sessionClosed)return;var ai2=parseInt(t.dataset.idx,10);S.attFin[ai2]=S.attHM[ai2]||'P';S.confResolved[ai2]=true;render();}
  else if(a==='acceptTR'){if(S.role!=='CURATOR'||S.sessionClosed)return;var ai3=parseInt(t.dataset.idx,10);S.attFin[ai3]=S.attTR[ai3]||'P';S.confResolved[ai3]=true;render();}
  else if(a==='closesession'){S.closeConfirm=true;render();}
  else if(a==='closeSessionConfirm'){
    if(S.role!=='CURATOR')return;
    var unresolved=visibleStudents().filter(function(st){var i=ST.indexOf(st);return !S.confResolved[i]&&(S.attHM[i]||'P')!==(S.attTR[i]||'P');});
    if(unresolved.length){toast('Разрешите '+unresolved.length+' расхожд. перед закрытием');return;}
    var arcAtt={};
    Object.keys(S.attFin).forEach(function(k){arcAtt[k]=S.attFin[k];});
    if(S.archive.some(function(x){return x.key===sessionKey();})){toast('Это занятие уже находится в архиве');return;}
    S.archive.push({key:sessionKey(),date:S.sessionDate,group:S.grp,studentNames:visibleStudents().map(function(x){return x.name;}),att:arcAtt,curator:S.user,subject:S.currentSubject});
    S.sessionClosed=true;S.closeConfirm=false;render();
  }
  else if(a==='closeSessionCancel'){S.closeConfirm=false;render();}
  else if(a==='markAllPresent'){
    if(S.role!=='HEADMAN')return;
    var _hadMarks=Object.keys(S.attHMSet).length>0;
    if(_hadMarks&&!window.confirm('Перезаписать все текущие отметки на «Присутствует»?'))return;
    ST.forEach(function(s,i){if(!s._expelled){S.attHM[i]='P';S.attHMSet[i]=true;S.att[i]='P';}});
    render();
  }
  else if(a==='createGroup'){
    if(S.role!=='DIRECTOR')return;
    var gn=document.getElementById('newGrpInp');
    var gnv=gn?gn.value.trim():'';
    if(!gnv){S.dirMsg='Введите название группы';S.dirMsgOk=false;render();return;}
    if(GRP[gnv]){S.dirMsg='Группа уже существует';S.dirMsgOk=false;render();return;}
    GRP[gnv]={teachers:[],students:[]};
    S.newGrpName='';S.dirMsg='Группа '+gnv+' создана';S.dirMsgOk=true;render();
  }
  else if(a==='assignCurator'){
    if(S.role!=='DIRECTOR')return;
    var acSel=document.getElementById('assignCurSel'),agSel=document.getElementById('assignGrpSel');
    var acv=acSel?acSel.value:'',agv=agSel?agSel.value:'';
    if(!acv||!agv){S.dirMsg='Выберите куратора и группу';S.dirMsgOk=false;render();return;}
    if(!GRP[agv]){S.dirMsg='Группа не найдена';S.dirMsgOk=false;render();return;}
    var curTgt=null;CUR.forEach(function(c){if(c.email===acv)curTgt=c;});
    if(!curTgt){S.dirMsg='Куратор не найден';S.dirMsgOk=false;render();return;}
    if(curTgt.groups.indexOf(agv)>=0){S.dirMsg='Уже прикреплено';S.dirMsgOk=false;render();return;}
    curTgt.groups.push(agv);
    S.assignCur='';S.assignGrp='';S.dirMsg='Куратор '+curTgt.name+' прикреплён к '+agv;S.dirMsgOk=true;render();
  }
  else if(a==='addteacher'){
    if(S.role!=='CURATOR')return;
    var grpA=t.dataset.grp,tnA=v;
    var _curA=null;CUR.forEach(function(c){if(c.name===S.user||c.email===S.user)_curA=c;});
    if(!_curA||_curA.groups.indexOf(grpA)<0)return;
    if(!GRP[grpA])return; // Task2: группа не найдена в GRP → блокировать
    if(!Array.isArray(GRP[grpA].teachers))GRP[grpA].teachers=[];
    if(GRP[grpA].teachers.indexOf(tnA)<0)GRP[grpA].teachers.push(tnA);
    render();
  }
  else if(a==='rmteacher'){
    if(S.role!=='CURATOR')return;
    var grpR=t.dataset.grp,tnR=v;
    var _curR=null;CUR.forEach(function(c){if(c.name===S.user||c.email===S.user)_curR=c;});
    if(!_curR||_curR.groups.indexOf(grpR)<0)return;
    if(GRP[grpR]&&Array.isArray(GRP[grpR].teachers))GRP[grpR].teachers=GRP[grpR].teachers.filter(function(x){return x!==tnR;});
    render();
  }
  else if(a==='setHeadman'){
    var hi=parseInt(t.dataset.idx,10),wasHm=ST[hi].hm;
    ST.forEach(function(s){s.hm=false;});
    if(!wasHm)ST[hi].hm=true;
    render();
  }
  else if(a==='reqapprove'||a==='reqreject'){
    if(!((S.role==='DIRECTOR')||(S.role==='CURATOR')))return;
    var qi=parseInt(v,10);
    if(S.role==='DIRECTOR'&&['TEACHER','CURATOR'].indexOf(PENDING_REQS[qi]&&PENDING_REQS[qi].role)<0)return;
    if(S.role==='CURATOR'&&(!PENDING_REQS[qi]||PENDING_REQS[qi].role!=='STUDENT'))return;
    if(PENDING_REQS[qi]){
      var qn=PENDING_REQS[qi].name;
      S.reqMsg=a==='reqapprove'?(qn+' — принят(а) в систему'):(qn+' — заявка отклонена');
      S.reqOk=(a==='reqapprove');
      PENDING_REQS.splice(qi,1);
      render();
    }
  }
  else if(a==='dpath'){
    if(S.role!=='DIRECTOR')return;
    var depth=parseInt(t.dataset.depth,10);
    if(depth===0)S.dp=[];
    else if(depth===1)S.dp=[t.dataset.cur];
    else if(depth===2)S.dp=[t.dataset.cur,t.dataset.grp];
    render();
  }
  else if(a==='del'){
    if(S.role!=='DIRECTOR')return;
    var delName=t.dataset.dname||'',delGrp=t.dataset.dgrp||'';
    if(!delName||!window.confirm('Удалить запись «'+delName+'»?'))return;
    if(delGrp&&GRP[delGrp]&&Array.isArray(GRP[delGrp].teachers)){
      GRP[delGrp].teachers=GRP[delGrp].teachers.filter(function(x){return x!==delName;});
    } else {
      TEACHERS=TEACHERS.filter(function(x){return x.name!==delName;});
      WLIST_DIR=WLIST_DIR.filter(function(x){return x.name!==delName;});
      Object.keys(GRP).forEach(function(g){if(Array.isArray(GRP[g].teachers))GRP[g].teachers=GRP[g].teachers.filter(function(x){return x!==delName;});});
    }
    render();
  }
  else if(a==='logout'){openLogout();}
  else if(a==='confirmLogout'){closeModal();S.view='login';S.step='form';S.pe=false;render();}
  else if(a==='closeModal'){closeModal();}
  else if(a==='theme'){S.tm=v;S.dark=(v==='dark');applyTheme();render();}
  else if(a==='autotheme'){S.tm=t.checked?'auto':(S.dark?'dark':'light');applyTheme();render();}
  else if(a==='expelBtn'){
    if(S.role!=='DIRECTOR')return;
    S.expelTarget={name:t.dataset.sname,grp:t.dataset.grp};S.expelMo=S.retainMo||3;render();
  }
  else if(a==='expelConfirm'){
    if(!S.expelTarget)return;
    expelStudent(S.expelTarget.name,S.expelTarget.grp,S.expelMo);S.expelTarget=null;render();
  }
  else if(a==='expelCancel'){S.expelTarget=null;render();}
  else if(a==='restoreStudent'){
    if(S.role!=='DIRECTOR')return;
    restoreStudent(parseInt(t.dataset.ei,10));
  }
  else if(a==='deleteAllDocs'){
    if(S.role!=='DIRECTOR')return;
    if(window.confirm('УДАЛИТЬ ВСЮ ДОКУМЕНТАЦИЮ? Необратимо.')&&window.confirm('Подтвердите ещё раз.')){
      S.archive=[];S.storeExpelled=[];S.attHM={};S.attTR={};S.attFin={};S.att={};S.attHMSet={};S.confResolved={};S.sessionClosed=false;ST.forEach(function(st){st._expelled=false;st._purged=false;st.recs=makeRecs(st.unex,st.exc);});Object.keys(GRP).forEach(function(g){GRP[g].students=(GRP[g].students||[]).filter(function(st){return ST.indexOf(st)>=0;});});S.currentSubject=SUBS[0];S.sessionDate=new Date().toISOString().slice(0,10);S.archSubjFilter='';
      ST.forEach(function(_,i){S.att[i]='P';S.attHM[i]='P';S.attFin[i]='P';S.attTR[i]='P';});
      toast('Документация удалена');render();
    }
  }
  else if(a==='savedone'){saveDemoState();toast('Изменения сохранены в демо-хранилище');var m=document.getElementById('smsg');if(m){m.style.display='inline';setTimeout(function(){m.style.display='none';},2500);}}
  else if(a==='csv'){exportCSV();}
  else if(a==='switchgrp'){
    if(S.role!=='CURATOR')return;
    var _cSw=null;if(Array.isArray(CUR))CUR.forEach(function(c){if(c.name===S.user||c.email===S.user)_cSw=c;});
    if(!_cSw||!Array.isArray(_cSw.groups)||_cSw.groups.indexOf(v)<0)return;
    S.grp=v;resetSessionForContext();render();
  }
}

function showPwdErr(show){
  S.pe=show;
  var p2=document.getElementById('lpwd2'),em=document.getElementById('perrmsg');
  if(p2)p2.classList.toggle('err',show);
  if(em)em.textContent=show?'Пароли не совпадают':'';
}

document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();}});

function handleInput(e){
  if(e.target.dataset.pwd){
    var p1=document.getElementById('lpwd'),p2=document.getElementById('lpwd2');
    if(p1&&p2){var mm=p2.value.length>0&&p1.value!==p2.value;if(mm!==S.pe)showPwdErr(mm);}
  }
  if(e.target.dataset.ci!==undefined){
    var ci=parseInt(e.target.dataset.ci,10),vv=e.target.value.replace(/[^0-9]/g,'');
    e.target.value=vv.slice(-1);
    if(vv&&ci<5){var nx=document.getElementById('ci'+(ci+1));if(nx)nx.focus();}
  }
}

function handleChange(e){
  if(e.target.id==='autotheme'){S.tm=e.target.checked?'auto':(S.dark?'dark':'light');applyTheme();render();return;}
  var _t=e.target.closest('[data-a]');
  if(_t){
    var _a=_t.dataset.a;
    if(_a==='retainSelect'){S.retainMo=parseInt(_t.value,10);render();}
    else if(_a==='subjectSelect'){S.currentSubject=_t.value;resetSessionForContext();render();}
    else if(_a==='dateSelect'){S.sessionDate=_t.value||S.sessionDate;resetSessionForContext();render();}
    else if(_a==='archiveFilter'){S.archSubjFilter=_t.value;render();}
    else if(_a==='archivSelect'){S.archiveMo=parseInt(_t.value,10);render();}
    else if(_a==='expelMoSel'){S.expelMo=parseInt(_t.value,10);}
  }
}

function doLogin(){
  var p1=document.getElementById('lpwd'),em=document.getElementById('lemail');
  if(!p1||!em||!em.value.trim()||!p1.value.trim())return;
  // Двухэтапная: генерируем и отправляем код
  S.flow='login';
  S.loginCode=String(Math.floor(100000+Math.random()*900000));
  S.step='sent';
  S.sp=false;
  render();
}

function showRErr(show){S.re=show;render();}

function doRegister(){
  var fio=document.getElementById('lfio'),em=document.getElementById('lemail'),
    p1=document.getElementById('lpwd'),p2=document.getElementById('lpwd2');
  if(!fio||!em||!p1||!p2)return;
  var fioVal=fio.value.trim(),emVal=em.value.trim().toLowerCase();
  if(!fioVal||!emVal||!p1.value.trim())return;
  if(p1.value!==p2.value){showPwdErr(true);return;}
  showPwdErr(false);
  // Whitelist check
  var role=S.lr,found=false,grpVal='';
  if(role==='STUDENT'){
    // Check WLIST_CUR: values are arrays of {email,name}
    var curKeys=Object.keys(WLIST_CUR);
    for(var wi=0;wi<curKeys.length;wi++){
      var curEmail=curKeys[wi],stList=WLIST_CUR[curEmail];
      for(var si=0;si<stList.length;si++){
        if(stList[si].email.toLowerCase()===emVal&&stList[si].name.toLowerCase()===fioVal.toLowerCase()){
          found=true;
          // Find curator's group
          CUR.forEach(function(c){if(c.email.toLowerCase()===curEmail&&c.groups.length)grpVal=c.groups[0];});
          break;
        }
      }
      if(found)break;
    }
  } else if(role==='CURATOR'||role==='TEACHER'){
    for(var di=0;di<WLIST_DIR.length;di++){
      if(WLIST_DIR[di].email.toLowerCase()===emVal&&WLIST_DIR[di].name.toLowerCase()===fioVal.toLowerCase()&&WLIST_DIR[di].role===role){
        found=true;break;
      }
    }
  } else {
    found=true; // DIRECTOR / HEADMAN — no whitelist in demo
  }
  if(!found){showRErr(true);return;}
  showRErr(false);
  var rlMap={STUDENT:'Студент',HEADMAN:'Староста',TEACHER:'Учитель',CURATOR:'Куратор',DIRECTOR:'Директор'};
  S.pendingReg={role:role,rl:rlMap[role]||role,name:fioVal,email:emVal,grp:grpVal};
  S.flow='register';
  S.loginCode=String(Math.floor(100000+Math.random()*900000));
  S.step='sent';S.sp=false;S.sp2=false;render();
}

function doApprove(){
  var rMap={
    STUDENT:{rl:'Студент',user:'Козлова Мария',tab:0,dt:'stats'},
    HEADMAN:{rl:'Староста',user:'Волкова Ольга',tab:0,dt:'journal'},
    TEACHER:{rl:'Учитель',user:'Петров Алексей',tab:0,dt:'journal'},
    CURATOR:{rl:'Куратор',user:'Смирнова Елена',tab:0,dt:'journal'},
    DIRECTOR:{rl:'Директор',user:'Директор',tab:0,dt:'director'}
  };
  var r=rMap[S.lr];
  if(r){Object.assign(S,r);S.role=S.lr;S.view='main';S.step='login';S.sp=false;S.sp2=false;render();}
}

function applyTheme(){
  var isDark=S.tm==='dark'||(S.tm==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.body.setAttribute('data-palette',S.palette||'indigo');
  if(isDark)document.body.setAttribute('data-dark','1');else document.body.removeAttribute('data-dark');
  S.dark=isDark;
  var toggle=document.getElementById('sw-dark');
  if(toggle){toggle.classList.toggle('is-dark',isDark);toggle.setAttribute('aria-pressed',String(isDark));var th=toggle.querySelector('.theme-toggle-thumb');if(th)th.innerHTML=isDark?moonIcon():sunIcon();var lab=toggle.querySelector('.theme-toggle-label');if(lab)lab.textContent=isDark?'Тёмная':'Светлая';}
  document.querySelectorAll('.theme-swatch').forEach(function(el){el.classList.toggle('on',el.dataset.v===S.palette);});
}

function exportCSV(){
  var cell=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var rows=[['Группа','Дата','Предмет','Студент','Статус','Неуважительные','Уважительные'].map(cell).join(',')];
  visibleStudents().forEach(function(s){var i=ST.indexOf(s),v=(S.role==='TEACHER'?S.attTR:(S.role==='CURATOR'||S.role==='DIRECTOR'?S.attFin:S.attHM))[i]||'P',a=ATT.filter(function(x){return x.k===v;})[0]||ATT[0];rows.push([S.grp,S.sessionDate,S.currentSubject,s.name,a.l,s.unex,s.exc].map(cell).join(','));});
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.join('\n'));a.download='journal-'+S.grp+'-'+S.sessionDate+'.csv';a.click();toast('CSV экспортирован');
}

document.addEventListener('click',handleClick);
document.addEventListener('input',handleInput);
document.addEventListener('change',handleChange);
applyTheme();
render();

</script>
</body>
</html>
